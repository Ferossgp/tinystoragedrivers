[package]
name = "tinystoragedrivers-connect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared database and transport connection handles for storage engines"
publish = false

[features]
default = []
sqlite = ["dep:rusqlite", "dep:tokio", "dep:zstd", "dep:serde_json"]
libsql = ["dep:libsql", "dep:libsql-hrana", "dep:tokio", "tokio/time", "tokio/sync", "tokio/net", "dep:zstd", "dep:serde_json", "dep:hyper", "dep:http", "dep:tower-service", "dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
mongodb = ["dep:mongodb"]
s3 = ["dep:object_store", "dep:url"]
amqp = ["dep:lapin"]
file = ["dep:tokio"]

[dependencies]
tinystoragedrivers-types = { workspace = true }
rusqlite = { version = "0.41.0", features = ["bundled"], optional = true }
libsql = { version = "0.10.0", default-features = false, features = ["core", "remote"], optional = true }
# One-request reads (libsql/read.rs) speak libSQL's own Hrana wire types.
libsql-hrana = { version = "0.10.0", optional = true }
# The remote transport (libsql/transport.rs): libSQL's `Builder::connector`
# takes a hyper 0.14 / tower connection service over a verified rustls 0.23
# stream; libsql/read.rs sends its requests through the same service.
hyper = { version = "0.14", default-features = false, features = ["client", "http1"], optional = true }
http = { version = "0.2", optional = true }
tower-service = { version = "0.3", optional = true }
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
zstd = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
mongodb = { version = "3.6", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"], optional = true }
object_store = { version = "0.14.2", default-features = false, features = ["aws"], optional = true }
url = { version = "2", optional = true }
lapin = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
